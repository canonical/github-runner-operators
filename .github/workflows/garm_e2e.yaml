#
# GARM end-to-end test workflow (ISD-285).
#
# Triggered on workflow_dispatch and pull_request (NOTE: pull_request trigger
# is temporary for testing in draft mode and will be removed before merging).
# This workflow is NOT a merge gate.

name: GARM E2E

on:
  workflow_dispatch:
  # Temporary trigger for testing on branch in draft PR — to be removed before merge.
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  build:
    name: Build artifacts
    uses: canonical/charm-ci/.github/workflows/build-artifacts.yml@v0.0.1-alpha.10
    permissions:
      contents: read
      packages: write
      actions: read

  e2e:
    name: GARM E2E test
    needs:
      - build
    runs-on: self-hosted-linux-amd64-noble-private-endpoint-medium
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up tmate session (self-hosted)
        if: runner.debug == 1 && runner.environment == 'self-hosted'
        uses: canonical/action-tmate@main
        with:
          detached: true
          timeout-minutes: 60

      # Load tenant configuration from GitHub secrets
      - name: Load tenant configuration
        env:
          OS_AUTH_URL: ${{ secrets.OS_AUTH_URL }}
          OS_PROJECT_NAME: ${{ secrets.OS_PROJECT_NAME }}
          OS_USER_DOMAIN_NAME: ${{ secrets.OS_USER_DOMAIN_NAME }}
          OS_PROJECT_DOMAIN_NAME: ${{ secrets.OS_PROJECT_DOMAIN_NAME }}
          OS_REGION_NAME: ${{ secrets.OS_REGION_NAME }}
          OS_NETWORK: ${{ secrets.OS_NETWORK }}
          TEST_GITHUB_APP_ID: ${{ secrets.TEST_GITHUB_APP_ID }}
          TEST_GITHUB_APP_INSTALLATION_ID: ${{ secrets.TEST_GITHUB_APP_INSTALLATION_ID }}
          TEST_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TEST_GITHUB_APP_PRIVATE_KEY }}
          TEST_GITHUB_PATH: ${{ secrets.TEST_GITHUB_PATH }}
          E2E_RUNNER_IMAGE_NAME: ${{ vars.E2E_RUNNER_IMAGE_NAME }}
          E2E_OPENSTACK_FLAVOR: ${{ vars.E2E_OPENSTACK_FLAVOR }}
          E2E_RUNNER_HTTP_PROXY: ${{ vars.E2E_RUNNER_HTTP_PROXY }}
        run: |
          set -euo pipefail

          for KEY in OS_AUTH_URL OS_PROJECT_NAME OS_USER_DOMAIN_NAME \
                     OS_PROJECT_DOMAIN_NAME OS_REGION_NAME OS_NETWORK \
                     TEST_GITHUB_APP_ID TEST_GITHUB_APP_INSTALLATION_ID \
                     TEST_GITHUB_APP_PRIVATE_KEY TEST_GITHUB_PATH; do
            if [ -z "${!KEY:-}" ]; then
              echo "::error::Missing repository secret: $KEY (Settings > Secrets > Actions)."
              exit 1
            fi
            echo "::add-mask::${!KEY}"
            echo "${KEY}=${!KEY}" >> "$GITHUB_ENV"
          done

          for KEY in E2E_RUNNER_IMAGE_NAME E2E_OPENSTACK_FLAVOR E2E_RUNNER_HTTP_PROXY; do
            if [ -n "${!KEY:-}" ]; then
              echo "${KEY}=${!KEY}" >> "$GITHUB_ENV"
            fi
          done

          echo "OS_IDENTITY_API_VERSION=3" >> "$GITHUB_ENV"

      - name: Fetch tenant credentials from Vault
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_APPROLE_ROLE_ID: ${{ secrets.VAULT_APPROLE_ROLE_ID }}
          VAULT_APPROLE_SECRET_ID: ${{ secrets.VAULT_APPROLE_SECRET_ID }}
          VAULT_KV_PATH: ${{ secrets.E2E_VAULT_KV_PATH || 'kv/data/garm-e2e/prodstack' }}
        run: |
          set -euo pipefail

          for KEY in VAULT_ADDR VAULT_APPROLE_ROLE_ID VAULT_APPROLE_SECRET_ID; do
            if [ -z "${!KEY:-}" ]; then
              echo "::error::Missing repository secret: $KEY (Settings > Secrets > Actions)."
              exit 1
            fi
          done

          vault_call() {
            curl -sS -o /tmp/vault-response.json -w '%{http_code}' "$@"
          }

          STATUS=$(vault_call -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg r "$VAULT_APPROLE_ROLE_ID" --arg s "$VAULT_APPROLE_SECRET_ID" \
                  '{role_id: $r, secret_id: $s}')" \
            "${VAULT_ADDR}/v1/auth/approle/login")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vault AppRole login failed with HTTP $STATUS: $(jq -rc '.errors // .' /tmp/vault-response.json)"
            exit 1
          fi

          VAULT_TOKEN=$(jq -r '.auth.client_token' /tmp/vault-response.json)
          echo "::add-mask::$VAULT_TOKEN"
          if [ -z "$VAULT_TOKEN" ] || [ "$VAULT_TOKEN" = "null" ]; then
            echo "::error::Vault AppRole login returned no client token."
            exit 1
          fi

          STATUS=$(vault_call -X GET -H "X-Vault-Token: $VAULT_TOKEN" \
            "${VAULT_ADDR}/v1/${VAULT_KV_PATH}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Vault read of ${VAULT_KV_PATH} failed with HTTP $STATUS: $(jq -rc '.errors // .' /tmp/vault-response.json)"
            exit 1
          fi

          for KEY in OS_USERNAME OS_PASSWORD; do
            VALUE=$(jq -r --arg k "$KEY" '.data.data[$k] // empty' /tmp/vault-response.json)
            echo "::add-mask::$VALUE"
            if [ -z "$VALUE" ]; then
              echo "::error::Field '$KEY' missing from the Vault secret at ${VAULT_KV_PATH}."
              exit 1
            fi
            echo "${KEY}=${VALUE}" >> "$GITHUB_ENV"
          done

          rm -f /tmp/vault-response.json
          echo "Tenant credentials fetched and masked."

      - name: Assert tenant connectivity and credentials
        run: |
          set -euo pipefail

          pipx install python-openstackclient || pip install --quiet python-openstackclient

          TOKEN_EXPIRES=$(openstack token issue -f value -c expires)
          echo "OpenStack token issued (expires: ${TOKEN_EXPIRES}). Tenant reachable."

      - name: Prepare concierge configuration for MetalLB
        run: |
          set -euo pipefail
          HOST_IP=$(hostname -I | awk '{print $1}')
          sed "s/@HOST_IP@/${HOST_IP}/g" concierge-e2e.yaml.tmpl > concierge.yaml
          echo "CONCIERGE=concierge.yaml" >> "$GITHUB_ENV"

      - name: Run E2E test via spread
        run: |
          set -euo pipefail
          pipx install 'opcli[cli] @ git+https://github.com/canonical/charm-ci.git@main' || \
            pip install 'opcli[cli] @ git+https://github.com/canonical/charm-ci.git@main'
          opcli install spread
          opcli spread run -- e2e-test-ci:...
