# Throwaway: tests cloudbase/garm#949 (runner tools for extra architectures) on
# s390x. Lives only on the test/garm-pr949-s390x branch; never merge it.
#
# The garm job runs GARM and garm-provider-lxd from main on an s390x runner and creates an s390x
# scale set named RUNNER_LABEL. The s390x-runner job, queued from the start,
# targets that scale set, so GARM boots an s390x LXD container that registers
# with the runner Canonical builds and takes the job. GitHub publishes no s390x
# runner, so that job running at all means GARM took the tools from the
# metadata URL.

name: GARM PR 949 s390x (throwaway)

on:
  push:
    branches: [test/garm-pr949-s390x]
  workflow_dispatch:

permissions:
  contents: read

# Runs share the runner VM pool and the E2E App; one at a time keeps them apart.
concurrency:
  group: garm-pr949-s390x
  cancel-in-progress: true

env:
  # Mains after cloudbase/garm#949 and garm-provider-lxd#25 merged.
  GARM_SHA: 030a39156879ab0d1197249d72328e3f69f7ad8d
  PROVIDER_LXD_SHA: e5c4f7d87d2049e29f1e3c9f9cf01c13f057c9fe
  TOOLS_METADATA_URL: https://api.github.com/repos/canonical/github-actions-runner/releases
  # Unique per attempt: a cancelled run can leave its scale set registered on
  # GitHub, and the next run could not create one under the same name.
  RUNNER_LABEL: garm-pr949-s390x-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  garm:
    name: GARM on s390x host
    runs-on: self-hosted-linux-s390x-noble-medium
    timeout-minutes: 75
    permissions:
      contents: read
      # Read the s390x-runner job's status, and cancel the run if this job
      # fails, so that job does not sit queued for a runner that never comes.
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - name: Set up tmate session (debug re-runs only)
        if: runner.debug == 1
        uses: canonical/action-tmate@5f11b26528699b78dadfb61273f4c859ac7145cf # main, 2026-04-27
        with:
          detached: true
          timeout-minutes: 60
          # The default ("auto") opens the session to anyone when the actor
          # has no public SSH key, and this repo's logs are public.
          limit-access-to-actor: true

      - name: Set up GARM with an s390x scale set
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_GITHUB_APP_ID: ${{ secrets.E2E_GITHUB_APP_ID }}
          E2E_GITHUB_APP_INSTALLATION_ID: ${{ secrets.E2E_GITHUB_APP_INSTALLATION_ID }}
          E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.E2E_GITHUB_APP_PRIVATE_KEY }}
        run: .github/garm-pr949-s390x/garm-s390x.sh setup

      - name: Wait for the job on the GARM-spawned runner
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_JOB: Job on GARM-spawned s390x runner
        # The runner was installed ~1 minute after the scale set in a good run;
        # this leaves room for GARM's 20 minute bootstrap timeout plus the job.
        timeout-minutes: 25
        run: |
          python3 -I - <<'SCRIPT'
          import json, os, sys, time, urllib.request

          url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
                 f"/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100")
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "Accept": "application/vnd.github+json",
          })
          target = os.environ["TARGET_JOB"]
          last = None
          while True:
              with urllib.request.urlopen(request, timeout=30) as response:
                  jobs = json.load(response)["jobs"]
              job = next((j for j in jobs if j["name"] == target), None)
              if job is None:
                  sys.exit(f"::error::No job named {target!r} in this run")
              state = (job["status"], job["conclusion"], job.get("runner_name"))
              if state != last:
                  print(f"{target}: status={state[0]} conclusion={state[1]} runner={state[2]}", flush=True)
                  last = state
              if job["status"] == "completed":
                  if job["conclusion"] != "success":
                      sys.exit(f"::error::{target} concluded {job['conclusion']}: {job['html_url']}")
                  break
              time.sleep(15)
          SCRIPT

      - name: Diagnostics
        if: always()
        run: .github/garm-pr949-s390x/garm-s390x.sh diagnostics

      - name: Tear down runners
        if: always()
        run: .github/garm-pr949-s390x/garm-s390x.sh teardown

      - name: Cancel the run so the s390x-runner job stops waiting
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"

  s390x-runner:
    name: Job on GARM-spawned s390x runner
    # Must match RUNNER_LABEL, the scale set name; the env context is not
    # available in runs-on. GitHub routes to a scale set by its name alone.
    runs-on: garm-pr949-s390x-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      - name: Assert this runs on s390x
        run: |
          set -euo pipefail
          echo "Runner: $(hostname), arch: $(uname -m), RUNNER_ARCH=${RUNNER_ARCH}"
          [ "$(uname -m)" = s390x ]
