#
# Trivial workflow that a spawned runner executes to prove the full chain:
# GARM → OpenStack → VM → runner register → job dispatch → pick up → exit.
# Modelled on github-runner-operator/.github/workflows/e2e_test_run.yaml.

name: GARM E2E test run

on:
  workflow_dispatch:
    inputs:
      runner-label:
        description: "Self-hosted runner label to target"
        required: true
        type: string

permissions:
  contents: read

jobs:
  e2e-test:
    name: GARM E2E test
    # A single combined label, matching this repo's runner naming
    # (e.g. self-hosted-linux-amd64-noble-medium) and how GitHub routes a job to a
    # GARM scale set — by its name as one label.
    runs-on: "${{ inputs.runner-label }}"
    timeout-minutes: 10
    steps:
      - name: Assert basic runner liveness
        run: |
          echo "=== GARM E2E test run ==="
          echo "Runner: $(hostname)"
          echo "Kernel: $(uname -a)"
      - name: Assert egress through aproxy
        run: |
          echo "Checking egress connectivity..."
          if curl -sf --max-time 10 https://github.com > /dev/null 2>&1; then
            echo "Egress OK (via aproxy)"
          else
            echo "Egress FAILED"
            exit 1
          fi
