title: GARM Admin Credentials Disclosed via Action
id: 9b8a7c6d-5e4f-4312-8807-6f5e4d3c2b1a
status: experimental
description: Detects use of the get-credentials Juju action disclosing GARM admin credentials.
author: Canonical
logsource:
  category: application
  product: canonical.garm
detection:
  selection:
    owasp_event.event|startswith: 'authz_admin'
    owasp_event.event|contains: 'get_credentials'
  condition: selection
falsepositives:
  - Authorized operator retrieving credentials during maintenance
level: high
