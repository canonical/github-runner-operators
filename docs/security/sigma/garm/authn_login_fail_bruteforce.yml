title: GARM High-Frequency Admin Login Failures
id: 1c2d3e4f-5061-4728-9394-a5b6c7d8e9f0
status: experimental
description: Detects repeated failed GARM admin logins in a short window (possible brute force).
author: Canonical Security
logsource:
  category: application
  product: canonical.garm
detection:
  selection:
    owasp_event.event|startswith: 'authn_login_fail'
  condition: selection
falsepositives:
  - Legitimate operator forgetting admin credentials
level: medium
---
title: GARM Login Failure Burst
id: 5f6a7b8c-9d0e-41f2-83a4-b5c6d7e8f901
status: experimental
description: Correlates repeated GARM admin login failures into a brute-force signal.
correlation:
  type: event_count
  rules:
    - 1c2d3e4f-5061-4728-9394-a5b6c7d8e9f0
  group-by:
    - owasp_event.appid
  timespan: 5m
  condition:
    gte: 5
level: medium
