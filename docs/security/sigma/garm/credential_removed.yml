title: GARM Forge Credential Removed
id: 2a3b4c5d-6e7f-4809-a1b2-c3d4e5f60718
status: experimental
description: Detects deletion of a stored GARM forge (GitHub/Gitea) credential.
author: Canonical
logsource:
  category: application
  product: canonical.garm
detection:
  selection:
    owasp_event.event|startswith: 'authn_token_delete'
  condition: selection
falsepositives:
  - Planned credential rotation or decommission
level: medium
