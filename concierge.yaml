juju:
  channel: 3.6/stable
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  lxd:
    enable: true
  k8s:
    channel: 1.34-classic/stable
    enable: true
    bootstrap: true
    # Canonical K8s turns on network, DNS and RBAC at bootstrap, so only storage
    # has to be asked for. Concierge applies each key with `k8s set` and then runs
    # `k8s enable <feature>`; values are passed through verbatim, so they are
    # quoted to stay strings.
    features:
      local-storage:
        enabled: "true"

host:
  snaps:
    rockcraft:
