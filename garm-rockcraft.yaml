name: garm
base: bare
build-base: ubuntu@24.04
version: "0.1"
summary: GARM — GitHub Actions Runner Manager
description: |
  ROCK image containing the GARM binary, the OpenStack provider binary, and
  the garm-agent binaries GARM serves to its runners.
platforms:
  amd64:

parts:
  garm:
    plugin: go
    source: https://github.com/cloudbase/garm
    source-type: git
    # 2026/09/15: Pin to the post-PR #878 metrics commit. This keeps the
    # scale-set pseudo pool ID fix from PR #866 and supplies the lifecycle,
    # listener, provider-operation, job, and watcher metrics used by the COS
    # operations dashboards and alert rules.
    source-commit: 9b86fcfb2826f45ffc881c2f5bf7070577ddc9a2
    source-depth: 1
    build-snaps:
      - go/1.26/stable
    build-environment:
      - GOTOOLCHAIN: local
    override-build: |
      cd "$CRAFT_PART_SRC"
      VERSION=$(git describe --tags --match='v[0-9]*' --always)
      go build -tags osusergo,netgo,sqlite_omit_load_extension \
        -ldflags "-extldflags -static -X github.com/cloudbase/garm/util/appdefaults.Version=${VERSION}" \
        -o bin/garm ./cmd/garm
      mkdir -p "$CRAFT_PART_INSTALL/usr/local/bin"
      cp bin/garm "$CRAFT_PART_INSTALL/usr/local/bin/"

  garm-provider-openstack:
    plugin: go
    source: https://github.com/cloudbase/garm-provider-openstack
    source-type: git
    # renovate: datasource=github-releases depName=cloudbase/garm-provider-openstack
    source-tag: v0.1.5
    build-snaps:
      - go/1.26/stable
    build-environment:
      - GOTOOLCHAIN: local
      # Force a fully static, pure-Go binary. The bare base ships no dynamic
      # loader or libc, so a cgo/dynamically-linked binary fails at fork/exec
      # with "no such file or directory" (missing ELF interpreter). CGO_ENABLED=0
      # selects the pure-Go net/os resolvers, mirroring the garm part's
      # osusergo,netgo,-static build.
      - CGO_ENABLED: "0"
    override-build: |
      cd "$CRAFT_PART_SRC"
      go build -o bin/garm-provider-openstack .
      mkdir -p "$CRAFT_PART_INSTALL/usr/local/bin"
      cp bin/garm-provider-openstack "$CRAFT_PART_INSTALL/usr/local/bin/"

  garm-agent:
    plugin: go
    source: https://github.com/cloudbase/garm-agent
    source-type: git
    # renovate: datasource=github-releases depName=cloudbase/garm-agent
    source-tag: v0.1.1
    build-snaps:
      - go/1.26/stable
    build-environment:
      - GOTOOLCHAIN: local
      - CGO_ENABLED: "0"
    override-build: |
      cd "$CRAFT_PART_SRC"
      VERSION=$(git describe --tags --match='v[0-9]*' --always)
      AGENT_DIR="$CRAFT_PART_INSTALL/opt/garm-agent"
      ARCHES="amd64 arm64"
      for arch in $ARCHES; do
        GOOS=linux GOARCH="$arch" go build \
          -ldflags "-s -w -X github.com/cloudbase/garm-agent/cmd.Version=${VERSION}" \
          -o "${AGENT_DIR}/linux/${arch}/garm-agent" .
      done
      {
        echo "version ${VERSION}"
        for arch in $ARCHES; do
          echo "${arch} $(sha256sum "${AGENT_DIR}/linux/${arch}/garm-agent" | cut -d' ' -f1)"
        done
      } > "${AGENT_DIR}/manifest.txt"

  # Bare rocks ship no CA trust store, so GARM's static Go binary trusts no
  # root CAs. This chisel slice provides the pre-generated
  # /etc/ssl/certs/ca-certificates.crt bundle so TLS verification works,
  # mirroring the go-framework extension's runtime part.
  runtime:
    plugin: nil
    stage-packages:
      - ca-certificates_data

  python:
    plugin: nil
    stage-packages:
      - base-files
      - python3-minimal
      - python3-tomli-w
      - python3-yaml

  garm-entrypoint:
    plugin: dump
    source: charms/garm/src
    source-type: local
    organize:
      garm_entrypoint.py: usr/local/bin/garm-entrypoint.py
    prime:
      - usr/local/bin/garm-entrypoint.py

  pebble-layer:
    plugin: nil
    override-build: |
      mkdir -p "$CRAFT_PART_INSTALL/var/lib/pebble/default/layers"
      cat > "$CRAFT_PART_INSTALL/var/lib/pebble/default/layers/001-garm.yaml" << 'EOF'
      summary: GARM service
      services:
        app:
          override: replace
          summary: GARM GitHub Actions Runner Manager
          startup: disabled
          command: /usr/local/bin/garm-entrypoint.py
      EOF
