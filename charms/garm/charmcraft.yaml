name: garm

type: charm

base: ubuntu@24.04

platforms:
  amd64:

summary: GARM — GitHub Actions Runner Manager charm.
links:
  documentation: https://canonical.com/juju/docs/github-runner-charms/

description: |
  Deploys and manages GARM (GitHub Actions Runner Manager) using the
  12-factor app framework with PostgreSQL storage and an OpenStack runner provider.

  GARM serves its API and Prometheus metrics on a single fixed port (8080), and
  its scrape target is declared in paas-config.yaml; the framework's app-port,
  metrics-port and metrics-path options are not used.

extensions:
  - go-framework

parts:
  # The go-framework extension owns the charm part and rejects customising it, but charmcraft
  # builds requirements.txt with --no-binary=:all: and the build environment carries no OpenSSL
  # headers, which the OpenStack SDK's cryptography dependency needs. A part of its own installs
  # them into the shared build environment before the charm part builds.
  build-deps:
    plugin: nil
    build-packages:
      - libssl-dev
      - pkg-config

requires:
  postgresql:
    interface: postgresql_client
    optional: false
    limit: 1
  garm-configurator:
    interface: garm_configurator_v0
  debug-ssh:
    interface: debug-ssh
    limit: 1

actions:
  get-credentials:
    description: Show the GARM admin credentials.
