name: garm

type: charm

base: ubuntu@24.04

platforms:
  amd64:

summary: GARM — GitHub Actions Runner Manager charm.
links:
  documentation: https://canonical.com/juju/docs/github-runner-charms/

description: |
  Deploys and manages GARM (GitHub Actions Runner Manager) using the
  12-factor app framework with PostgreSQL storage and an OpenStack runner provider.

  GARM serves its API and Prometheus metrics on a single fixed port (8080), and
  its scrape target is declared in paas-config.yaml; the framework's app-port,
  metrics-port and metrics-path options are not used.

extensions:
  - go-framework

requires:
  postgresql:
    interface: postgresql_client
    optional: false
    limit: 1
  garm-configurator:
    interface: garm_configurator_v0
  debug-ssh:
    interface: debug-ssh
    limit: 1

actions:
  get-credentials:
    description: Show the GARM admin credentials.

# The go-framework extension owns the charm part and only supports the legacy charm plugin on
# this base, so the shared relation model cannot be a uv source. Copy it into lib/ with an
# explicit part instead; Charmcraft's monorepo support makes ../lib resolvable at build time.
parts:
  shared-lib:
    plugin: nil
    source: ../lib
    override-build: |
      install -D garm_configurator_relation.py \
        "$CRAFT_PART_INSTALL/lib/garm_configurator_relation.py"
