# This file configures Charmcraft.
# See https://juju.is/docs/sdk/charmcraft-config for guidance.

name: garm-configurator

type: charm

base: ubuntu@24.04
platforms:
  amd64:

summary: Configuration broker charm for GARM scalesets.
links:
  documentation: https://canonical.com/juju/docs/github-runner-charms/

description: |
  Holds configuration for a single GARM scaleset and provider combination,
  sharing it with the GARM charm via Juju integrations.

config:
  options:
    openstack-auth-url:
      type: string
      description: |
        OpenStack Keystone authentication URL.
    openstack-username:
      type: string
      description: |
        OpenStack username for authentication.
    openstack-password:
      type: secret
      description: |
        Juju secret containing the OpenStack password for authentication.
        The secret content must have a "value" key with the password string.
    openstack-project-name:
      type: string
      description: |
        OpenStack project (tenant) name.
    openstack-user-domain-name:
      type: string
      description: |
        OpenStack user domain name.
    openstack-project-domain-name:
      type: string
      description: |
        OpenStack project domain name.
    openstack-region-name:
      type: string
      description: |
        OpenStack region name.
    openstack-network:
      type: string
      description: |
        OpenStack network name or ID to use for instances.
    github-app-id:
      type: int
      description: |
        GitHub App ID (numeric).
    github-app-installation-id:
      type: int
      description: |
        GitHub App installation ID.
    github-app-private-key:
      type: secret
      description: |
        Juju secret containing the GitHub App private key (PEM format).
        The secret content must have a "value" key with the private key string.
    name:
      type: string
      description: |
        The name of the scaleset.
    flavor:
      type: string
      description: |
        The resource flavor to use for runners in the scaleset.
    os-arch:
      type: string
      description: |
        The CPU architecture for runners in the scaleset.
    image:
      type: string
      description: |
        Stable OpenStack image name or image ID to use for runners. An image name
        must uniquely identify one image in the OpenStack project. When unset,
        the image is read from the image relation for backwards compatibility.
        If neither source provides an image, GARM removes this configurator's
        scale set and its runners.
    image-visibility:
      type: string
      description: |
        Optional Glance visibility used when the OpenStack provider looks up an image
        by name: public, private, shared, community, or all. When unset, the provider
        searches public images only, so a private image needs "private". It has no
        effect when the image is an ID.
    min-idle-runner:
      type: int
      default: 0
      description: |
        Minimum number of idle runners in the scaleset.
    max-runner:
      type: int
      default: 1
      description: |
        Maximum number of runners in the scaleset. Must be greater than 0.
    labels:
      type: string
      description: |
        Comma-separated list of labels to add to runners.
    repo:
      type: string
      description: |
        Repository to register runners to. Mutually exclusive with org.
    org:
      type: string
      description: |
        Organization to register runners to. Mutually exclusive with repo.
    runner-group:
      type: string
      default: Default
      description: |
        Runner group for org registration. Ignored when repo is set.
    enable-shell:
      type: boolean
      default: true
      description: |
        Enable the GARM remote shell on the scaleset, letting an administrator open an
        interactive session on a runner through GARM. The session rides the GARM agent's
        websocket, so the garm charm needs an ingress for the agent to dial back to, and
        that ingress must terminate TLS: the agent silently disables its shell whenever
        the agent URL is cleartext, rather than expose a shell in the clear.
    pre-install-scripts:
      type: string
      description: |
        A Python dict-like string containing key-value pairs of script name
        to bash script to be run prior to runner installation.
    security-group-rules:
      type: string
      default: '[{"direction": "egress", "remote_ip_prefix": "0.0.0.0/0"}, {"direction": "egress", "remote_ip_prefix": "::/0"}]'
      description: |
        Optional JSON list of rules for the OpenStack security group the charm manages
        for this scaleset's runners. Each rule takes:
        "direction" ("ingress" or "egress", required), "protocol" ("tcp", "udp",
        "icmp", "icmpv6", or "any", default "any"), "port_min" and "port_max"
        (inclusive, 1-65535, tcp and udp only; "port_min" alone means that one port),
        and "remote_ip_prefix" (a CIDR such as "10.0.0.0/8", default every address).
        For example:
        [{"direction": "ingress", "protocol": "tcp", "port_min": 22, "remote_ip_prefix": "10.0.0.0/8"}].
        The charm creates a group named "garm-<name>" and keeps its rules equal to
        this list, so rules added to the group by hand are removed. When no egress
        rule is listed the charm allows all egress, because OpenStack attaches this
        group instead of the project's default group and a runner that cannot reach
        GitHub never runs a job. The group this charm manages is never deleted: clearing
        this option, or removing the application, leaves it in place for the operator to
        remove. A duplicate group that shares the name is deleted, keeping the oldest,
        because OpenStack allows duplicate names. Requires OpenStack credentials allowed to
        create and delete security groups and security group rules.
    dockerhub-mirror:
      type: string
      description: |
        Optional Docker registry mirror URL for runners. Must be a valid http(s) address.
    runner-http-proxy:
      type: string
      description: |
        Optional HTTP proxy that aproxy forwards to. Must be a valid http(s) URL.
    aproxy-exclude-addresses:
      type: string
      description: |
        Optional comma-separated IPv4 addresses, CIDRs, or ranges to exclude from aproxy forwarding.
    aproxy-redirect-ports:
      type: string
      description: |
        Optional comma-separated ports or port ranges (e.g. 80,443,8000-9000) to forward to aproxy.
    otel-collector-endpoint:
      type: string
      description: |
        Optional OTEL exporter address for the otel-collector to connect to. Must be a valid http(s) URL.
    pre-job-script:
      type: string
      description: |
        Optional bash script appended to the end of the runner pre-job script.
        If the script exits with a non-zero code, the job fails and the workflow
        steps do not run.

requires:
  image:
    interface: github_runner_image_v0
    limit: 1
    optional: true

provides:
  garm-configurator:
    interface: garm_configurator_v0
    limit: 1

parts:
  charm:
    source: .
    plugin: charm
    # charmcraft installs requirements.txt with --no-binary=:all:, so the OpenStack SDK's
    # cryptography dependency is built from source and needs the OpenSSL headers.
    build-packages:
      - libssl-dev
      - pkg-config
